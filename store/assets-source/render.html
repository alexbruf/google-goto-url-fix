<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Google Goto Url Fix Store Asset</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f7faff;
    }
    .asset { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    .screenshot {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover; object-position: left top;
    }
    .shot-panel {
      position: absolute; right: 48px; top: 185px; width: 410px;
      padding: 34px; border: 1px solid #dce7f8; border-radius: 24px;
      background: rgba(255,255,255,.97); box-shadow: 0 18px 50px rgba(27,74,140,.14);
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    .brand img { width: 54px; height: 54px; }
    .eyebrow { color: #1a73e8; font-size: 14px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-size: 38px; line-height: 1.08; letter-spacing: -.04em; }
    p { margin: 0; color: #536078; font-size: 19px; line-height: 1.45; }
    .pill { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; padding: 10px 14px; border-radius: 999px; background: #eaf2ff; color: #1458b0; font-weight: 700; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #20a464; }

    .promo, .marquee {
      background: radial-gradient(circle at 85% 5%, #d6e7ff 0, transparent 36%), linear-gradient(135deg, #f8fbff, #edf5ff);
      display: flex; align-items: center;
    }
    .promo::after, .marquee::after {
      content: ""; position: absolute; width: 44%; aspect-ratio: 1; right: -10%; bottom: -55%;
      border: 2px solid rgba(26,115,232,.15); border-radius: 50%; box-shadow: 0 0 0 24px rgba(26,115,232,.05), 0 0 0 48px rgba(26,115,232,.03);
    }
    .promo .copy { position: relative; z-index: 1; padding: 34px 36px; }
    .promo .brand { margin-bottom: 14px; }
    .promo .brand img { width: 46px; height: 46px; }
    .promo h1 { max-width: 330px; font-size: 32px; margin-bottom: 10px; }
    .promo p { max-width: 320px; font-size: 16px; }

    .marquee .copy { position: relative; z-index: 2; width: 54%; padding-left: 105px; }
    .marquee h1 { max-width: 630px; font-size: 64px; }
    .marquee p { max-width: 600px; font-size: 25px; }
    .marquee .mock {
      position: absolute; z-index: 1; right: -45px; top: 78px; width: 650px; height: 408px;
      border: 9px solid #172033; border-radius: 18px; overflow: hidden; background: white;
      box-shadow: 0 30px 70px rgba(27,74,140,.25); transform: rotate(-2deg);
    }
    .marquee .mock img { width: 100%; height: 100%; object-fit: cover; object-position: left top; }
  </style>
</head>
<body>
  <main id="asset" class="asset">
    <img class="screenshot" src="../assets/screenshot-google-results-1280x800.png" alt="Google Search results">
    <section class="shot-panel">
      <div class="brand"><img src="../../icons/icon-128.png" alt=""><span class="eyebrow">One-click link cleanup</span></div>
      <h1>Copy the destination, not the detour.</h1>
      <p>Turns opaque Google Goto links into ordinary, copyable URLs directly on the results page.</p>
      <span class="pill"><span class="dot"></span> Private and local</span>
    </section>
  </main>
  <script>
    const mode = new URLSearchParams(location.search).get("mode") || "screenshot";
    const asset = document.querySelector("#asset");
    if (mode === "promo") {
      asset.className = "asset promo";
      asset.innerHTML = `<div class="copy"><div class="brand"><img src="../../icons/icon-128.png" alt=""><span class="eyebrow">Browser extension</span></div><h1>Google Goto Url Fix</h1><p>Normal, copyable links in one click.</p></div>`;
    } else if (mode === "marquee") {
      asset.className = "asset marquee";
      asset.innerHTML = `<div class="copy"><div class="brand"><img src="../../icons/icon-128.png" alt=""><span class="eyebrow">Google Goto Url Fix</span></div><h1>Skip the redirect. Keep the real link.</h1><p>Restore ordinary, copyable URLs on Google Search.</p></div><div class="mock"><img src="../assets/screenshot-google-results-1280x800.png" alt="Google Search results"></div>`;
    }
  </script>
</body>
</html>
