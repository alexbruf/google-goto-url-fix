name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build and test every browser package
        run: npm run check

      - name: Upload unsigned browser packages
        uses: actions/upload-artifact@v7
        with:
          name: browser-packages-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

